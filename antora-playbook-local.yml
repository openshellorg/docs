site:
  title: OpenShellOrg Docs
  url: https://docs.opensh.org
  start_page: open-shell-org::index.adoc
  keys:
    header_logo: logo.svg
    site_home_url: https://opensh.org
    site_home_label: OpenShellOrg home
    header_doc_title: OpenShellOrg Docs

antora:
  extensions:
    - '@antora/lunr-extension'
    - require: '@antora-supplemental/unversioned-component-urls'
    - '@antora-supplemental/build-stack'

content:
  sources:
    - url: ./
      branches: HEAD
      start_path: docs
    - url: ../shell-architecture
      branches: HEAD
      start_path: docs
    - url: ../nu-emit
      branches: HEAD
      start_path: docs
    - url: ../nu-require
      branches: HEAD
      start_path: docs
    - url: ../about
      branches: HEAD
      start_path: docs
    - url: ../info
      branches: HEAD
      start_path: docs
    - url: ../prohelp
      branches: HEAD
      start_path: docs
    - url: ../prohelp-cli
      branches: HEAD
      start_path: docs
    - url: ../project-map
      branches: HEAD
      start_path: docs
    - url: ../actor-shell
      branches: HEAD
      start_path: docs
    - url: ../terminal-gui-prompts
      branches: HEAD
      start_path: docs

ui:
  bundle:
    url: https://github.com/antora-supplemental/valentus-theme/releases/download/v2/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui

asciidoc:
  attributes:
    stem: latexmath
    experimental: ""
    idprefix: ""
    idseparator: "-"
    page-pagination: ""

output:
  dir: build/site
