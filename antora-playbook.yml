# OpenShellOrg Docs — CI/production (Facto stack + OSO hub sources)
site:
  title: OpenShellOrg Docs
  url: https://docs.opensh.org
  robots: |
    User-agent: *
    Allow: /
    Sitemap: https://docs.opensh.org/sitemap.xml
  start_page: open-shell-org::index.adoc
  keys:
    header_logo: logo.svg
    site_home_url: https://opensh.org
    site_home_label: OpenShellOrg home
    header_doc_title: OpenShellOrg Docs
    nav_typology_diataxis: 'true'

urls:
  html_extension_style: indexify

antora:
  extensions:
    - '@antora/lunr-extension'
    - require: '@antora-supplemental/unversioned-component-urls'
    - require: '@antora-supplemental/site-nav-tree'
      include:
        - open-shell-org
        - shell-architecture
        - tools
      order:
        - open-shell-org
        - shell-architecture
        - tools
    - require: '@antora-supplemental/nav-typology'
    - require: '@antora-supplemental/nav-typology-diataxis'
    - '@antora-supplemental/build-stack'
    - ./lib/verify-themed-svg-dark-mode.js
    - '@antora-supplemental/page-edit'
    - require: '@antora-supplemental/link-validator'
      reportEmail: openshell@devcentr.org
      softFail403: true
      failLevel: none
    - require: '@antora-supplemental/linkinator'
      statusDefault: unchecked
    - require: '@antora-supplemental/extension-lister'
      layouts: [footer]
    - require: '@antora-supplemental/orphan-finder/extension'
      reportEmail: openshell@devcentr.org
      failOnUnresolved: false
    - require: '@antora-supplemental/page-context/antora'
      component: open-shell-org
      path: keywords
    # Diagram rendering engines (Facto / antora-diagram-engines + Kroki — no alternate renderers):
    # | Format | Engine |
    # | [source,mermaid] listings | @antora-supplemental/mermaid-client (client runtime) |
    # | plantuml, ditaa, … | asciidoctor-kroki → kroki-server-url |
    # | zoom / lightbox chrome | @antora-supplemental/diagram-lightbox |
    # | [.themed-svg] image::… committed SVGs | upstream mermaid-cli + mermaid-svg-css-vars; @dev-centr/themed-svg at site runtime (not AsciiDoc listing renderers) |
    - require: '@antora-supplemental/mermaid-client/antora'
    - require: '@antora-supplemental/diagram-lightbox'

content:
  sources:
    - url: ./
      branches: HEAD
      start_path: docs
    # Hub-owned ROOT for the shared `tools` component; member repos must use name: tools + modules/<id>/.
    - url: ./
      branches: HEAD
      start_path: docs-tools
    - url: https://github.com/openshellorg/shell-architecture.git
      branches: [main]
      start_path: docs
    # Tools members (migrate antora.yml to name: tools + modules/<id>/ in each repo).
    - url: https://github.com/openshellorg/nu-emit.git
      branches: [main]
      start_path: docs
    - url: https://github.com/openshellorg/nu-require.git
      branches: [main]
      start_path: docs
    - url: https://github.com/openshellorg/about.git
      branches: [main]
      start_path: docs
    - url: https://github.com/openshellorg/info.git
      branches: [main]
      start_path: docs
    - url: https://github.com/openshellorg/prohelp.git
      branches: [main]
      start_path: docs
    - url: https://github.com/openshellorg/prohelp-cli.git
      branches: [main]
      start_path: docs
    - url: https://github.com/openshellorg/project-map.git
      branches: [main]
      start_path: docs
    - url: https://github.com/openshellorg/terminal-gui-prompts.git
      branches: [main]
      start_path: docs

ui:
  bundle:
    url: https://github.com/antora-supplemental/valentus-theme/releases/download/v2/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui

asciidoc:
  extensions:
    # Kroki bakes PlantUML and other non-Mermaid diagram types; mermaid-client skips [source,mermaid].
    - asciidoctor-kroki
    - '@antora-supplemental/page-context'
  attributes:
    stem: latexmath
    experimental: ""
    idprefix: ""
    idseparator: "-"
    page-pagination: ""
    kroki-server-url: https://kroki.io
    kroki-fetch-diagram: true
    mermaid-client: ''
    mermaid-client-mode: client
    page-context-active: ''
    page-context-keyword-base: '/open-shell-org/keywords'

output:
  dir: build/site
