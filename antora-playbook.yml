# OpenShellOrg Docs — CI/production (Facto stack + OSO hub sources)
# Local clones: facto-stack registers antora-local-content-sources (auto off in CI).
site:
  title: OpenShellOrg Docs
  url: https://docs.opensh.org
  robots: |
    User-agent: *
    Allow: /
    Sitemap: https://docs.opensh.org/sitemap.xml
  start_page: open-shell-org::index.adoc
  keys:
    header_logo: logo.svg
    site_home_url: https://opensh.org
    site_home_label: OpenShellOrg home
    header_doc_title: OpenShellOrg Docs
    nav_typology_diataxis: 'true'

urls:
  html_extension_style: indexify

antora:
  extensions:
    - ./lib/verify-themed-svg-dark-mode.js
    - require: '@antora-supplemental/facto-stack'
      profile: hub
      siteNavTree:
        enabled: true
        include:
          - open-shell-org
          - shell-architecture
          - tools
        order:
          - open-shell-org
          - shell-architecture
          - tools
      linkValidator:
        reportEmail: openshell@devcentr.org
        softFail403: true
        failLevel: none
      orphanFinder:
        reportEmail: openshell@devcentr.org
        failOnUnresolved: false
      pageContextAntora:
        component: open-shell-org
        path: keywords
      softNavPageToc:
        injectScript: false
      mermaidClient:
        enabled: true
      diagramLightbox:
        enabled: true
      relatedDocs:
        sites: none
      asciidocAttributes:
        page-context-author-label: username
        page-context-author-avatar: without-icon
        page-context-keyword-base: '/open-shell-org/keywords'
        mermaid-client: ''
        mermaid-client-mode: client

content:
  sources:
    - url: ./
      branches: HEAD
      start_path: docs
    # Hub-owned ROOT for the shared `tools` component; member repos must use name: tools + modules/<id>/.
    - url: ./
      branches: HEAD
      start_path: docs-tools
    - url: https://github.com/openshellorg/shell-architecture.git
      branches: [main]
      start_path: docs
    # Tools members (migrate antora.yml to name: tools + modules/<id>/ in each repo).
    - url: https://github.com/openshellorg/nu-emit.git
      branches: [main]
      start_path: docs
    - url: https://github.com/openshellorg/command-namespace.git
      branches: [main]
      start_path: docs
    - url: https://github.com/openshellorg/ns.git
      branches: [main]
      start_path: docs
    - url: https://github.com/openshellorg/install.git
      branches: [main]
      start_path: docs
    - url: https://github.com/openshellorg/versions.git
      branches: [main]
      start_path: docs
    - url: https://github.com/openshellorg/isolate.git
      branches: [main]
      start_path: docs
    - url: https://github.com/openshellorg/nu-require.git
      branches: [main]
      start_path: docs
    - url: https://github.com/openshellorg/about.git
      branches: [main]
      start_path: docs
    - url: https://github.com/openshellorg/info.git
      branches: [main]
      start_path: docs
    - url: https://github.com/openshellorg/prohelp.git
      branches: [main]
      start_path: docs
    - url: https://github.com/openshellorg/prohelp-cli.git
      branches: [main]
      start_path: docs
    - url: https://github.com/openshellorg/project-map.git
      branches: [main]
      start_path: docs
    - url: https://github.com/openshellorg/terminal-gui-prompts.git
      branches: [main]
      start_path: docs

ui:
  bundle:
    url: https://github.com/antora-supplemental/valentus-theme/releases/download/v4.2.2/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui

asciidoc:
  # facto-stack bundles the AsciiDoc extensions (emoji-literals, emoji, kroki, page-context)
  # and stem/kroki/page-context defaults; hub page-context values live in asciidocAttributes above.
  attributes:
    experimental: ""
    idprefix: ""
    idseparator: "-"
    page-pagination: ""

output:
  dir: build/site
