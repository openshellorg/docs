<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">CLI output routing</title>
<desc id="d">A command's events split three ways. Outcome, changes, decisions, failure reasons and the log path go to the terminal. Routine checks, progress and dependency warnings go to a sectioned, indexed log file. Every event also goes to a JSON Lines record for agents and scripts.</desc>
<style>
.canvas{fill:#ffffff}.box{fill:#f3f4f6;stroke:#374151;stroke-width:1.5}.acc{fill:#dbeafe;stroke:#1d4ed8;stroke-width:1.5}
.txt{fill:#111827;font-size:14px}.mut{fill:#4b5563;font-size:12px}.edge{stroke:#374151;stroke-width:1.5;fill:none}.head{fill:#374151}
@media (prefers-color-scheme: dark){.canvas{fill:#111827}.box{fill:#1f2937;stroke:#d1d5db}.acc{fill:#1e3a8a;stroke:#93c5fd}.txt{fill:#f9fafb}.mut{fill:#d1d5db}.edge{stroke:#d1d5db}.head{fill:#d1d5db}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="canvas" width="760" height="300"/>
<rect class="acc" x="20" y="120" width="170" height="60" rx="8"/>
<text class="txt" x="105" y="146" text-anchor="middle">Command events</text>
<text class="mut" x="105" y="164" text-anchor="middle">checks, changes, errors</text>
<rect class="box" x="300" y="20" width="440" height="70" rx="8"/>
<text class="txt" x="316" y="44">Terminal (stdout / stderr)</text>
<text class="mut" x="316" y="64">outcome, what changed, decisions, failure reasons,</text>
<text class="mut" x="316" y="80">section references, absolute log path</text>
<rect class="box" x="300" y="115" width="440" height="70" rx="8"/>
<text class="txt" x="316" y="139">Sectioned log file</text>
<text class="mut" x="316" y="159">routine passing checks, progress, dependency warnings,</text>
<text class="mut" x="316" y="175">full detail (streamed to screen with --verbose)</text>
<rect class="box" x="300" y="210" width="440" height="70" rx="8"/>
<text class="txt" x="316" y="234">Machine-readable record</text>
<text class="mut" x="316" y="254">--json result on stdout; JSON Lines log for agents</text>
<text class="mut" x="316" y="270">and scripts</text>
<path class="edge" d="M190,140 C240,140 250,55 296,55" marker-end="url(#a)"/>
<path class="edge" d="M190,150 L296,150" marker-end="url(#a)"/>
<path class="edge" d="M190,160 C240,160 250,245 296,245" marker-end="url(#a)"/>
</svg>